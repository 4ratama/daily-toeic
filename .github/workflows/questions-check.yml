name: Check questions
on:
  pull_request:
    paths: ["questions.json", "scripts/check-questions.mjs"]
  push:
    branches: [main]
    paths: ["questions.json", "scripts/check-questions.mjs"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-questions.mjs
