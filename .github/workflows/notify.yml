name: Daily Discord notification
on:
  schedule:
    - cron: "*/10 * * * *"   # 10分ごとに確認し、config.json の時刻になったら送る
  workflow_dispatch:
    inputs:
      test:
        description: "テスト通知を今すぐ送る"
        type: boolean
        default: true
concurrency:
  group: notify
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/notify.mjs
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/?v=${{ github.sha }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
      - name: 送信記録を保存
        run: |
          if ! git diff --quiet state/sent.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/sent.json
            git commit -m "Record sent notifications [skip ci]"
            git pull --rebase -q origin main
            git push
          fi
